<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Redirect | Tokard.dev</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/background.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imgs/favicon.png') }}">
</head>
<body>
    <div class="context">
        <div style="position: absolute; width: 100%; text-align: center;">
        {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert {{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
        </div>

        <div class=" d-flex flex-column justify-content-center align-items-center">
            
                <a href="/" style="z-index: 2;" draggable="false">
                    <img class="tokalogo" style="padding-top: 5vh; z-index: 2;" draggable="false" src="{{ url_for('static', filename='imgs/tokachannel.webp') }}"/>
                </a>
                <div style="padding-left: 10px; padding-right: 10px; width: 100%;" class="d-flex justify-content-center">
                    <div class="card">
                        <div class="card-body text-light">
                            <h1 class="card-title text-center">URL Shortener</h1>
                            <form method="POST" action="{{ url_for('add_redirect') }}">
                                <div class="form-group">
                                    <label for="code">Name</label>
                                    <input type="text" class="form-control" id="code" name="code">
                                </div>
                                <div class="form-group">
                                    <label for="link">Link</label>
                                    <input type="text" class="form-control" id="link" name="link">
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">Create Link</button>
                            </form>
                        </div>
                    </div>
                </div>
        </div>

    </div>
    
     <div class="area" >
        <ul class="circles">
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
        </ul>
</div >

</body>
</html>
