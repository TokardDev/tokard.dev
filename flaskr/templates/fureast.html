<script>
				function updateStyle(main, secondary) {
document.body.style.backgroundColor = `rgb(${main})`;
document.querySelectorAll('.text-azure').forEach((el) => {
el.style.color = `rgb(${secondary})`;
});
document.querySelectorAll('.bg-azure').forEach((el) => {
el.style.color = `rgb(${secondary})`;
});
document.querySelectorAll('.border-azure').forEach((el) => {
el.style.borderColor = `rgb(${secondary})`;
});
// Remove hover:bg-azure
document.querySelectorAll('.hover\\:bg-azure').forEach((el) => {
el.classList.remove('hover:bg-azure');
});
}
const colorThief = new ColorThief();
const img = document.querySelector('#avatar');

// Make sure image is finished loading
if (img.complete) {
var colors = colorThief.getPalette(img);updateStyle(colors[0], colors[1]);} else {
img.addEventListener('load', function () {
var colors = colorThief.getPalette(img);updateStyle(colors[0], colors[1]);});
}
			</script>
